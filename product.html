<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT. — Product</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/riso.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .product-header {
      min-height: 52vh;
      padding-top: 80px;
      display: flex;
      align-items: flex-end;
      padding-bottom: 48px;
      padding-left: 56px;
      padding-right: 56px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    /* Carrot emoji — large, multiply */
    .product-header-carrot {
      position: absolute;
      right: 6%;
      bottom: -4px;
      font-size: clamp(130px, 17vw, 220px);
      line-height: 1;
      mix-blend-mode: multiply;
      transform: rotate(-10deg);
      z-index: 3;
      user-select: none;
    }

    /* Ghost — misregistration offset */
    .product-header-carrot-ghost {
      position: absolute;
      right: 6%;
      bottom: -4px;
      font-size: clamp(130px, 17vw, 220px);
      line-height: 1;
      mix-blend-mode: multiply;
      transform: rotate(-10deg) translate(7px, -6px);
      z-index: 2;
      opacity: 0.25;
      filter: saturate(0) contrast(0.7);
      user-select: none;
    }

    .product-header-text {
      position: relative;
      z-index: 4;
    }

    .product-header-text h1 {
      font-size: clamp(32px, 5.5vw, 64px);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.0;
      /* color set by JS if needed; default paper */
      color: var(--paper);
      margin-bottom: 8px;
    }

    .product-header-text p {
      font-size: 13px;
      color: rgba(244,237,216,0.6);
      letter-spacing: 0.06em;
    }

    .product-body {
      max-width: 780px;
      margin: 0 auto;
      padding: 64px 48px;
    }

    .breadcrumb {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.32;
      margin-bottom: 48px;
    }
    .breadcrumb a { color: inherit; text-decoration: none; }
    .breadcrumb a:hover { opacity: 0.7; }

    .product-nav-bar {
      display: flex;
      justify-content: space-between;
      padding: 28px 0;
      border-top: 1.5px solid rgba(24,16,10,0.10);
      margin-top: 52px;
    }

    .product-nav-bar a {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      opacity: 0.3;
      transition: opacity 0.2s;
    }
    .product-nav-bar a:hover { opacity: 1; }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 48px;
      flex-wrap: wrap;
    }

    .stock-note {
      font-size: 12px;
      opacity: 0.32;
      letter-spacing: 0.04em;
    }

    @media (max-width: 768px) {
      .product-header { padding: 90px 20px 40px; min-height: 40vh; }
      .product-header-carrot,
      .product-header-carrot-ghost { font-size: 90px; right: 3%; }
      .product-body { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <!-- ── NAV ────────────────────────────────────────── -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">CARROT.</a>
    <ul class="nav-links">
      <li><a href="index.html#lineup">Lineup</a></li>
      <li><a href="index.html#brand">Brand</a></li>
      <li><a href="index.html#sizes">Sizes</a></li>
    </ul>
    <a href="cart.html" class="btn btn-primary" style="padding:10px 18px;font-size:13px;">🛒</a>
  </nav>

  <!-- ── PRODUCT HEADER (vivid bg, set by JS) ───────── -->
  <header id="product-header" class="product-header">

    <!-- Ghost carrot (misregistration) -->
    <div class="product-header-carrot-ghost" id="product-emoji-ghost">🥕</div>
    <!-- Main carrot -->
    <div class="product-header-carrot" id="product-emoji">🥕</div>

    <div class="product-header-text">
      <h1 id="product-name">—</h1>
      <p  id="product-tagline">—</p>
    </div>

  </header>

  <div class="color-strip"></div>

  <!-- ── PRODUCT BODY ───────────────────────────────── -->
  <div class="product-body">

    <div class="breadcrumb">
      <a href="index.html">← All Products</a>
    </div>

    <!-- Dual function -->
    <div class="section-label">Dual Function</div>
    <div class="dual-display">
      <div class="dual-item">
        <div class="dual-label" id="func-stationery-label">As stationery</div>
        <div class="dual-desc"  id="func-stationery-desc">—</div>
      </div>
      <div class="dual-item dual-item-equipment">
        <div class="dual-label" id="func-equipment-label">As equipment</div>
        <div class="dual-desc"  id="func-equipment-desc">—</div>
      </div>
    </div>

    <!-- Size selector -->
    <div style="margin-top:44px;">
      <div class="section-label">Select Size</div>
      <div class="size-selector" id="size-selector"></div>
      <div class="size-info"     id="size-info"></div>
    </div>

    <!-- Irony bubble -->
    <div style="margin-top:48px;">
      <div class="speech-bubble" id="product-bubble">
        <span id="product-irony">—</span>
      </div>
      <div class="bubble-tail" id="bubble-tail"
           style="border-width:14px 12px 0 0;border-style:solid;border-right-color:transparent;"></div>
    </div>

    <!-- CTA -->
    <div class="cta-row">
      <button class="btn btn-primary" id="add-to-cart-btn">Add to Cart</button>
      <span class="stock-note">In stock — S / M / L</span>
    </div>

    <!-- Prev / next -->
    <div class="product-nav-bar">
      <a href="#" id="product-prev">←</a>
      <a href="#" id="product-next">→</a>
    </div>

  </div>

  <div class="color-strip"></div>
  <footer>
    <span>© 2025 CARROT.</span>
    <span>Stationery by day. Equipment when needed.</span>
    <span>Zootopia · Est. 2025</span>
  </footer>

  <script src="js/products.js"></script>
  <script>
    renderProductDetail();

    document.getElementById('add-to-cart-btn').addEventListener('click', function () {
      const id = new URLSearchParams(window.location.search).get('id') || products[0].id;
      const activeBtn = document.querySelector('.size-btn.active');
      const size = activeBtn ? activeBtn.dataset.size : 'M';

      const cart = JSON.parse(localStorage.getItem('carrot-cart') || '[]');
      cart.push({ id, size });
      localStorage.setItem('carrot-cart', JSON.stringify(cart));

      this.textContent = '✓ Added — delivered undercover';
      this.disabled = true;
      this.style.opacity = '0.5';
    });
  </script>

</body>
</html>
