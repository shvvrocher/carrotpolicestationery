<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT. — ZPD Official Stationery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/riso.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/hero-interactive.css">
</head>
<body>

  <!-- ── NAV ────────────────────────────────────────── -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">CARROT.</a>
    <a href="cart.html" class="nav-cart">🛒</a>
  </nav>

  <!-- ── HERO: interactive stamp + investigation ── -->

  <!-- Hidden SVG distortion filter -->
  <svg style="display:none" aria-hidden="true">
    <defs>
      <filter id="distort" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence id="ft" type="turbulence"
          baseFrequency="0.04" numOctaves="3" seed="5" result="noise"/>
        <feDisplacementMap id="fdm" in="SourceGraphic" in2="noise"
          scale="0" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- Custom cursor (follows mouse via JS) -->
  <div id="cursor" aria-hidden="true">🥕</div>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite"></div>

  <section class="hero hero-interactive" id="hero">

    <!-- Stamp layer (stamps appended here by JS) -->
    <div id="stamp-layer"></div>

    <!-- Footprint layer (footprints appended here by JS) -->
    <div id="footprint-layer"></div>

    <!-- Stamp counter (top-left) / Criminal counter (top-right) -->
    <div id="stamp-counter"></div>
    <div id="criminal-counter"></div>

    <!-- First-visit hint -->
    <div id="hero-hint">
      click anywhere to stamp<br>
      <span style="opacity:0.6;font-size:9px;">double-click to clear</span>
    </div>

    <!-- Tagline (bottom-right) -->
    <div class="hero-tagline">
      Zootopia · Est. 2025
    </div>

    <!-- Scroll hint -->
    <div class="scroll-hint">↓ Lineup</div>

    <!-- Left slider: SHAPE (distortion) -->
    <div class="hero-slider hero-slider-left">
      <label for="shape-slider">SHAPE</label>
      <input type="range" id="shape-slider" min="0" max="100" value="0">
    </div>

    <!-- Right slider: SIZE -->
    <div class="hero-slider hero-slider-right">
      <label for="size-slider">SIZE</label>
      <input type="range" id="size-slider" min="20" max="180" value="70">
    </div>

    <!-- Criminal lineup (bottom-right, filled by JS when caught) -->
    <div id="criminal-lineup"></div>

  </section>

  <!-- ── 4-COLOR STRIP ──────────────────────────────── -->
  <div class="color-strip"></div>

  <!-- ── LINEUP ─────────────────────────────────────── -->
  <section class="products-section" id="lineup">
    <div style="padding:0 var(--gap-lg) var(--gap-lg);">
      <div class="section-label">Product Lineup</div>
      <h2 class="section-title">04 Items.<br>08 Functions.</h2>
    </div>

    <!-- Conveyor belt — no buttons, auto-scrolls continuously -->
    <div class="carousel-container">
      <div class="carousel-track" id="carousel-track">
        <!-- rendered by products.js — cards doubled for seamless loop -->
      </div>
    </div>
  </section>


  <!-- ── FOOTER ─────────────────────────────────────── -->
  <div class="color-strip"></div>
  <footer>
    <span>© 2025 CARROT.</span>
    <span>Stationery by day. Equipment when needed.</span>
    <span>Zootopia · Est. 2025</span>
  </footer>

  <script src="js/products.js"></script>
  <script>renderProductCards('carousel-track');</script>
  <script src="js/carousel.js"></script>
  <script src="js/hero-interactive.js"></script>

</body>
</html>
