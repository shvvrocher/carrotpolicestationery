<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — CARROT.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/riso.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .cart-page {
      min-height: 100vh;
      padding-top: 80px;
      display: flex;
      flex-direction: column;
    }

    .cart-body {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 64px 48px;
    }

    /* ── CART ITEM ROW ── */
    .cart-item {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1.5px solid rgba(24,16,10,0.10);
    }

    .cart-item-visual {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .cart-item-visual-bg {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(244,237,216,0.28) 24%, transparent 25%);
      background-size: 7px 7px;
    }

    .cart-item-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .cart-item-meta {
      font-size: 11px;
      opacity: 0.38;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cart-item-price {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: right;
    }

    .cart-item-remove {
      display: block;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.25;
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--font);
      color: var(--ink);
      margin-top: 6px;
      padding: 0;
      transition: opacity 0.15s;
      text-align: right;
    }
    .cart-item-remove:hover { opacity: 0.7; }

    /* ── SIZE CHIP ── */
    .cart-size-chip {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border: 1.5px solid rgba(24,16,10,0.18);
      color: rgba(24,16,10,0.45);
      margin-top: 6px;
    }

    /* ── SUMMARY ── */
    .cart-summary {
      margin-top: 32px;
      padding: 28px;
      background: rgba(24,16,10,0.03);
      border: 1.5px solid rgba(24,16,10,0.10);
    }

    .cart-summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    .cart-summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.02em;
      padding-top: 14px;
      border-top: 1.5px solid rgba(24,16,10,0.12);
      margin-top: 8px;
      opacity: 1;
    }

    .cart-cta {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ── EMPTY STATE ── */
    .cart-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 0;
    }

    .cart-empty-blob {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 32px;
    }

    .cart-empty-blob-shape {
      position: absolute;
      inset: 0;
      background-color: var(--orange);
      background-image: radial-gradient(circle, rgba(244,237,216,0.28) 24%, transparent 25%);
      background-size: 9px 9px;
      border-radius: 68% 32% 55% 45% / 45% 58% 38% 62%;
      mix-blend-mode: multiply;
      opacity: 0.7;
    }

    .cart-empty-blob-blue {
      position: absolute;
      inset: 10%;
      background-color: var(--blue);
      background-image: radial-gradient(circle, rgba(244,237,216,0.24) 24%, transparent 25%);
      background-size: 8px 8px;
      border-radius: 32% 68% 42% 58% / 62% 38% 55% 45%;
      mix-blend-mode: multiply;
      opacity: 0.6;
      transform: rotate(15deg);
    }

    .cart-empty-carrot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      z-index: 2;
    }

    .cart-empty-title {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .cart-empty-sub {
      font-size: 13px;
      opacity: 0.4;
      line-height: 1.7;
      max-width: 280px;
      margin-bottom: 32px;
    }

    /* show/hide logic */
    .cart-has-items { display: block; }

    @media (max-width: 768px) {
      .cart-body { padding: 40px 20px; }
      .cart-item { grid-template-columns: 56px 1fr auto; gap: 14px; }
      .cart-item-visual { width: 56px; height: 56px; font-size: 24px; }
    }
  </style>
</head>
<body class="cart-page">

  <!-- ── NAV ── -->
  <nav class="nav">
    <a href="index.html" class="nav-logo">CARROT.</a>
    <ul class="nav-links">
      <li><a href="index.html#lineup">Lineup</a></li>
      <li><a href="index.html#brand">Brand</a></li>
      <li><a href="index.html#sizes">Sizes</a></li>
    </ul>
    <a href="cart.html" class="btn btn-primary" style="padding:10px 18px;font-size:13px;">🛒</a>
  </nav>

  <div class="cart-body">

    <div class="section-label">Your Cart</div>
    <h1 class="section-title" style="margin-bottom:var(--gap-md);" id="cart-title">—</h1>

    <!-- ── HAS ITEMS ── -->
    <div id="cart-has-items" class="cart-has-items" style="display:none;">

      <div id="cart-items-list"></div>

      <div class="cart-summary">
        <div class="cart-summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">—</span>
        </div>
        <div class="cart-summary-row">
          <span>Undercover delivery</span>
          <span>Free</span>
        </div>
        <div class="cart-summary-total">
          <span>Total</span>
          <span id="cart-total">—</span>
        </div>
      </div>

      <div class="cart-cta">
        <button class="btn btn-primary"
                onclick="this.textContent='✓ Order placed — arriving undercover';this.disabled=true;this.style.opacity='0.5';">
          Place Order
        </button>
        <a href="index.html#lineup" class="btn btn-outline">Continue Shopping</a>
      </div>

    </div>

    <!-- ── EMPTY ── -->
    <div id="cart-empty" class="cart-empty" style="display:none;">

      <div class="cart-empty-blob">
        <div class="cart-empty-blob-shape"></div>
        <div class="cart-empty-blob-blue"></div>
        <div class="cart-empty-carrot">🥕</div>
      </div>

      <div class="cart-empty-title">Nothing here yet.</div>
      <p class="cart-empty-sub">
        Your cart is empty.<br>
        Go pick your undercover equipment.
      </p>
      <a href="index.html#lineup" class="btn btn-primary">Browse Lineup</a>

    </div>

  </div>

  <div class="color-strip"></div>
  <footer>
    <span>© 2025 CARROT.</span>
    <span>Stationery by day. Equipment when needed.</span>
    <span>Zootopia · Est. 2025</span>
  </footer>

  <script src="js/products.js"></script>
  <script>
    const PRICES = { 'pencil-lens': 28, 'tape-measure': 32, 'file-board': 36, 'tumbler-spray': 42 };

    function loadCart() {
      try { return JSON.parse(localStorage.getItem('carrot-cart') || '[]'); }
      catch { return []; }
    }

    function saveCart(cart) {
      localStorage.setItem('carrot-cart', JSON.stringify(cart));
    }

    function renderCart() {
      const cart = loadCart();
      const titleEl   = document.getElementById('cart-title');
      const emptyEl   = document.getElementById('cart-empty');
      const hasEl     = document.getElementById('cart-has-items');
      const listEl    = document.getElementById('cart-items-list');
      const subtotalEl = document.getElementById('cart-subtotal');
      const totalEl   = document.getElementById('cart-total');

      if (cart.length === 0) {
        titleEl.textContent = 'Empty.';
        emptyEl.style.display = 'flex';
        hasEl.style.display   = 'none';
        return;
      }

      titleEl.textContent = `${cart.length} Item${cart.length > 1 ? 's' : ''}.`;
      emptyEl.style.display = 'none';
      hasEl.style.display   = 'block';

      let subtotal = 0;
      listEl.innerHTML = cart.map((item, idx) => {
        const p     = products.find(x => x.id === item.id);
        if (!p) return '';
        const price = PRICES[p.id] || 30;
        subtotal += price;
        return `
          <div class="cart-item">
            <div class="cart-item-visual" style="background-color:${p.cardBg.split(';')[0].replace('background-color:','').trim()}">
              <div class="cart-item-visual-bg"></div>
              <span style="position:relative;z-index:2;">${p.emoji}</span>
            </div>
            <div>
              <div class="cart-item-name">${p.name}</div>
              <div class="cart-item-meta">${p.tagline}</div>
              <span class="cart-size-chip">${item.size}</span>
            </div>
            <div>
              <div class="cart-item-price">$${price}</div>
              <button class="cart-item-remove" onclick="removeItem(${idx})">Remove</button>
            </div>
          </div>`;
      }).join('');

      subtotalEl.textContent = `$${subtotal}`;
      totalEl.textContent    = `$${subtotal}`;
    }

    function removeItem(idx) {
      const cart = loadCart();
      cart.splice(idx, 1);
      saveCart(cart);
      renderCart();
    }

    renderCart();
  </script>

</body>
</html>
